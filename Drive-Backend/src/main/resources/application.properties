# Name of the Spring Boot application
spring.application.name=Drive-Backend

# Database connection (MySQL running locally on port 3306, database name: drive_db)
spring.datasource.url=jdbc:mysql://localhost:3306/drive_db
# Database login username
spring.datasource.username=root
# Database login password
spring.datasource.password=Gyana@2005

# Automatically create/update tables based on your entity classes
spring.jpa.hibernate.ddl-auto=update
# Print SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true

# Folder where uploaded files will be saved
file.upload-dir=uploads/